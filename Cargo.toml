[package]
name = "lite-pg"
version = "0.1.0"
edition = "2021"
description = "Lightning-fast PostgreSQL TUI client"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "chrono", "uuid"] }
tui-textarea = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
arboard = "3"
fuzzy-matcher = "0.3"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
dirs = "6"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
